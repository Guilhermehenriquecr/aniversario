<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><title>Uma mensagem reservada</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 30%,#4a2e326b,transparent 48%),linear-gradient(145deg,#21151b,#120b10);color:#f7efe4;font-family:Inter,system-ui,sans-serif}.moldura{position:fixed;inset:12px;border:1px solid #d0ae7b24;pointer-events:none}.card{width:min(100%,440px);padding:42px 28px;text-align:center;border:1px solid #c9a97845;background:#21151bd9;box-shadow:0 30px 90px #0007}.eyebrow{font-size:10px;letter-spacing:.25em;color:#c9a978;margin-bottom:25px}.mark{font:44px Georgia,serif;color:#e8d0aa;margin-bottom:22px}.card h1{font:400 clamp(34px,9vw,52px)/1 Georgia,serif;margin:0 0 14px}.card p{font:16px/1.55 Georgia,serif;color:#d5c5b8;margin:0 auto 25px;max-width:28ch}.field{display:flex;gap:8px;margin:0 auto;width:min(100%,320px)}input{flex:1;min-width:0;border:1px solid #c9a9785c;background:#140c11;color:#fff5e8;padding:14px 15px;font-size:16px;border-radius:2px}button{min-width:112px;border:1px solid #f0d9ad;background:#dfc59e;color:#24171b;padding:14px 16px;border-radius:2px;font-weight:600;cursor:pointer}button:active{transform:translateY(1px)}.error{min-height:24px;color:#eab0a4;font-size:13px;margin:12px 0 0}.foot{font-size:10px;letter-spacing:.1em;color:#b8a7a0;margin-top:28px}@media(max-width:430px){.card{padding:36px 20px}.field{flex-direction:column}button{width:100%}}
  </style>
</head>
<body><div class="moldura"></div><main class="card"><div class="eyebrow">UMA MENSAGEM RESERVADA</div><div class="mark">22 / 09</div><h1>Antes de entrar</h1><p>Existe uma senha para esta experiência. Ela fica disponível somente até hoje.</p><form id="form"><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Digite a senha" aria-label="Senha" required><button>Entrar</button></div><div id="error" class="error" role="alert"></div></form><div class="foot">uma leitura para ser sentida com calma</div></main><script>const form=document.getElementById('form'),input=document.getElementById('password'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const button=form.querySelector('button');button.disabled=true;button.textContent='Abrindo…';try{const r=await fetch('/api/site-access',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:input.value})});if(!r.ok)throw new Error('Senha incorreta.');location.href='/'}catch(err){error.textContent=err.message;button.disabled=false;button.textContent='Entrar';input.select()}});</script></body>
</html>
