<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Painel · 22 de setembro</title>
  <style>
    :root{color-scheme:dark;--bg:#130b10;--card:#21131b;--line:#3b2530;--gold:#e6bf77;--muted:#b8a5ae}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#35202a 0,#130b10 48%);color:#f8edf0;font:15px Inter,system-ui,sans-serif;min-height:100vh}
    main{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:32px 0 56px}h1{font:400 clamp(30px,6vw,54px) Georgia,serif;margin:0 0 8px}p{color:var(--muted)}button{border:1px solid #78533b;background:#38221d;color:#ffe9bc;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:600}button:hover{background:#513126}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#21131bcc;border:1px solid var(--line);border-radius:18px;padding:18px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.value{font-size:32px;color:var(--gold);margin-top:10px}.table{margin-top:20px;overflow:auto;border:1px solid var(--line);border-radius:18px;background:#1b1117}.row{display:grid;grid-template-columns:140px 1fr 130px 120px 1fr;gap:12px;padding:13px 16px;border-bottom:1px solid #30202a;min-width:720px}.row:last-child{border:0}.head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.login{max-width:400px;margin:12vh auto;background:#21131b;border:1px solid var(--line);border-radius:22px;padding:26px}.login input{width:100%;margin:7px 0 12px;padding:13px;border-radius:10px;border:1px solid var(--line);background:#130b10;color:white}.login button{width:100%}.hidden{display:none}.notice{padding:14px;border:1px solid #78533b;border-radius:12px;color:#ffe9bc;margin:18px 0}.danger{border-color:#743b45;background:#321b24}.actions{display:flex;gap:10px;flex-wrap:wrap}
    @media(max-width:700px){main{width:min(100% - 22px,560px);padding-top:22px}.top{align-items:start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.value{font-size:26px}}
  </style>
</head>
<body>
  <section id="login" class="login"><div class="label">Área privada</div><h1>Painel</h1><p>Leituras da experiência.</p><form id="login-form"><label>Usuário<input name="user" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="login-error"></p></section>
  <main id="dashboard" class="hidden"><div class="top"><div><div class="label">22 de setembro</div><h1>Acompanhamento</h1><p id="updated">Carregando…</p></div><div class="actions"><button id="refresh">Atualizar</button><button id="reset" class="danger">Zerar contadores</button></div></div><div id="setup" class="notice hidden">Configure <b>KV_REST_API_URL</b> e <b>KV_REST_API_TOKEN</b> nas variáveis do projeto Vercel para ativar o armazenamento.</div><section class="cards"><div class="card"><div class="label">Aberturas</div><div id="opens" class="value">0</div></div><div class="card"><div class="label">Sessões únicas</div><div id="sessions" class="value">0</div></div><div class="card"><div class="label">Concluíram</div><div id="done" class="value">0</div></div><div class="card"><div class="label">Última cidade</div><div id="city" class="value" style="font-size:20px">—</div></div></section><div class="table"><div class="row head"><span>Data</span><span>Evento</span><span>Slide</span><span>Aparelho</span><span>Localidade</span></div><div id="events"></div></div></main>
  <script>
    const $=s=>document.querySelector(s), tokenKey='admin-token'; let token=sessionStorage.getItem(tokenKey);
    function showDash(){ $('#login').classList.add('hidden'); $('#dashboard').classList.remove('hidden'); load(); }
    $('#login-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok){$('#login-error').textContent=j.error;return}token=j.token;sessionStorage.setItem(tokenKey,token);showDash()});
    async function load(){const r=await fetch('/api/admin-events',{headers:{authorization:'Bearer '+token}});if(r.status===401){sessionStorage.removeItem(tokenKey);location.reload();return}const j=await r.json();$('#setup').classList.toggle('hidden',!j.setup);const ev=j.events||[];const opens=ev.filter(x=>x.type==='opened');const done=ev.filter(x=>x.type==='completed');$('#opens').textContent=opens.length;$('#sessions').textContent=new Set(opens.map(x=>x.sessionId)).size;$('#done').textContent=done.length;$('#city').textContent=opens[0]?[opens[0].city,opens[0].region].filter(Boolean).join(', '):'—';$('#updated').textContent='Atualizado em '+new Date().toLocaleString('pt-BR');$('#events').innerHTML=ev.slice(0,100).map(x=>`<div class="row"><span>${new Date(x.at).toLocaleString('pt-BR')}</span><span>${x.type}</span><span>${x.slide||'—'}${x.totalSlides?' / '+x.totalSlides:''}</span><span>${x.device||'—'}</span><span>${[x.city,x.region,x.country].filter(Boolean).join(', ')||'—'}</span></div>`).join('')||'<div class="row">Nenhuma visita registrada.</div>'}
    $('#refresh').onclick=load;$('#reset').onclick=async()=>{if(!confirm('Zerar todos os registros de visita?'))return;await fetch('/api/admin-reset',{method:'POST',headers:{authorization:'Bearer '+token}});load()}; if(token)showDash();
  </script>
</body></html>
